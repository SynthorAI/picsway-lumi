name: Deploy PicSway Lumi Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: picsway-lumi-production
  cancel-in-progress: true

env:
  AWS_REGION: us-east-2
  S3_BUCKET: picsway-lumi-frontend
  CLOUDFRONT_DISTRIBUTION_ID: EJ3E2NR0RPKBH

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # TEMPORARY: put OIDC diagnostics first so failures happen immediately.
      - name: Debug GitHub OIDC claims
        shell: bash
        env:
          AUDIENCE: sts.amazonaws.com
        run: |
          set -euo pipefail

          RESPONSE="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"

          ID_TOKEN="$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"

          python3 - "$ID_TOKEN" <<'PY'
          import base64
          import json
          import sys

          token = sys.argv[1]
          payload = token.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload.encode()).decode())

          wanted = [
              'iss',
              'aud',
              'sub',
              'repository',
              'repository_id',
              'repository_owner',
              'repository_owner_id',
              'ref',
              'ref_type',
              'environment',
              'workflow_ref',
              'job_workflow_ref',
          ]

          print('=== GITHUB OIDC CLAIMS FOR AWS DEBUG ===')
          for key in wanted:
              print(f'{key}={claims.get(key)}')
          print('=== END OIDC CLAIMS ===')
          PY

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Upload versioned assets to S3
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html without browser caching
        run: |
          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html" \
            --content-type "text/html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
